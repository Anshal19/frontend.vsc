<!DOCTYPE html>
<html>
<head>
    <title>Student Registration Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }

        .container {
            width: 600px;
            margin: 30px auto;
        }

        h1 {
            text-align: center;
        }

        table {
            width: 100%;
        }

        td {
            padding: 8px;
        }

        input, select, textarea {
            padding: 6px;
            width: 95%;
        }

        input[type="radio"],
        input[type="checkbox"] {
            width: auto;
        }

        textarea {
            height: 70px;
        }

        .submit {
            width: auto;
            padding: 8px 20px;
        }
    </style>
</head>

<body>

<div class="container">
    <h1>Student Registration Form</h1>

    <form>
        <table>
            <tr>
                <td>Roll no. :</td>
                <td><input type="text"></td>
            </tr>

            <tr>
                <td>Student name :</td>
                <td>
                    <input type="text" placeholder="First Name">
                    <input type="text" placeholder="Last Name">
                </td>
            </tr>

            <tr>
                <td>Father's name :</td>
                <td><input type="text"></td>
            </tr>

            <tr>
                <td>Date of birth :</td>
                <td><input type="date"></td>
            </tr>

            <tr>
                <td>Mobile no. :</td>
                <td><input type="tel" placeholder="+91"></td>
            </tr>

            <tr>
                <td>Email id :</td>
                <td><input type="email"></td>
            </tr>

            <tr>
                <td>Password :</td>
                <td><input type="password"></td>
            </tr>

            <tr>
                <td>Gender :</td>
                <td>
                    <input type="radio" name="gender"> Male
                    <input type="radio" name="gender"> Female
                </td>
            </tr>

            <tr>
                <td>Department :</td>
                <td>
                    <input type="checkbox"> CSE
                    <input type="checkbox"> IT
                    <input type="checkbox"> ECE
                    <input type="checkbox"> Civil
                </td>
            </tr>

            <tr>
                <td>Course :</td>
                <td>
                    <select>
                        <option>Select Course</option>
                        <option>B.Tech</option>
                        <option>BCA</option>
                        <option>MCA</option>
                        <option>B.Sc</option>
                    </select>
                </td>
            </tr>

            <tr>
                <td>Student photo :</td>
                <td><input type="file"></td>
            </tr>

            <tr>
                <td>City :</td>
                <td><input type="text"></td>
            </tr>

            <tr>
                <td>Address :</td>
                <td><textarea></textarea></td>
            </tr>

            <tr>
                <td></td>
                <td>
                    <input class="submit" type="submit" value="Register">
                </td>
            </tr>
        </table>
    </form>
</div>

</body>
</html>
